name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type publish-npm to publish @mean-weasel/contract-ledger to npm."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: npm-production
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == 'publish-npm')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
